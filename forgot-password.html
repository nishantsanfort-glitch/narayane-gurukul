<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary SEO Meta Tags -->
    <title>Forgot Password - Reset Your Narayan e-Gurukul Account</title>
    <meta name="description" content="Reset your Narayan e-Gurukul account password. Enter your registered email address to receive a secure password reset link.">
    <meta name="keywords" content="Narayan e-Gurukul forgot password, reset password engineering portal">
    <meta name="author" content="Narayan e-Gurukul Team">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://narayenegurukul.com/forgot-password.html">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://narayenegurukul.com/forgot-password.html">
    <meta property="og:title" content="Forgot Password - Narayan e-Gurukul">
    <meta property="og:description" content="Reset your Narayan e-Gurukul account password securely.">
    <meta property="og:site_name" content="Narayan e-Gurukul">
    <meta property="og:locale" content="en_IN">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .auth-section {
            min-height: calc(100vh - var(--navbar-height));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(var(--navbar-height) + 4rem) 6% 4rem;
        }

        .auth-card {
            background: var(--white);
            padding: 3rem;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-light);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .auth-card h2 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
            color: var(--primary);
        }

        .auth-card p {
            margin-bottom: 2.5rem;
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .auth-form .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .auth-form input {
            padding: 1rem 1.25rem;
            border-radius: var(--radius-sm);
        }

        .auth-footer {
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-light);
            font-size: 0.95rem;
        }

        .auth-footer a {
            color: var(--accent);
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .auth-footer a:hover {
            opacity: 0.8;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 2.5rem 1.5rem;
            }

            .auth-card h2 {
                font-size: 2rem;
            }
        }
    </style>
    <link rel="stylesheet" href="green-theme.css">
</head>
<body>
    <header>
        <nav class="navbar" id="navbar">
            <a href="index.html" class="logo">
                <h1>Narayan <span>e-Gurukul</span></h1>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="btech-studymaterial.html" class="nav-cta">Study Material</a></li>
            </ul>
            <div class="menu-toggle" id="mobile-menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <main>
        <section class="auth-section reveal active">
            <div class="auth-card">
                <h2>Reset Password</h2>
                <p>Enter your email address and we'll send you a link to reset your password.</p>

                <form class="auth-form">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="student@university.edu" required>
                    </div>

                    <button type="submit" class="btn primary-btn" style="width: 100%; justify-content: center;">
                        Send Reset Link <i class="ri-mail-send-line"></i>
                    </button>
                </form>

                <div class="auth-footer">
                    <a href="login.html"><i class="ri-arrow-left-line"></i> Back to Login</a>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
